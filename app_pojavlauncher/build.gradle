plugins {
    id 'com.android.application' version '9.3.1'
}

static def getDate() { return new Date().format('yyyyMMdd') }

def getVersionName = {
    // Get the last version tag, as well as the short head of the last commit
    String TAG = ""
    String semVer = "1.1.7"
    // Used by the fallback for github actions
    String TAG_PART_COMMIT = ""
    String TAG_STRING

    try {
        TAG = providers.exec {
            // PvPHouse: ignore the rolling "latest-debug" release tag
            commandLine 'git', 'describe', '--tags', '--exclude', 'latest-*'
            ignoreExitValue = true
        }.getStandardOutput().asText.get()
    } catch (Exception e) {
        e.printStackTrace()
    }

    // Fallback for action builds
    if (TAG.toString().trim().isEmpty()) {
        try {
            TAG_PART_COMMIT = providers.exec {
                commandLine 'git', 'describe', '--always', '--tags', '--exclude', 'latest-*'
                ignoreExitValue = true
            }.getStandardOutput().asText.get()
        } catch (Exception ignored) {
        }
    }


    // PvPHouse: an exact release tag (v1.2.3) gives a clean version name "1.2.3"
    if (TAG.trim() ==~ /v\d+\.\d+\.\d+/) {
        return TAG.trim().substring(1)
    }

    if(!TAG.isBlank()){
        TAG_STRING = TAG
    }else {
        if(TAG_PART_COMMIT.isBlank()){
             //Fallback no repo
            return ("LOCAL-" + "${getDate()}")
        }else {
            // Used by github actions
            TAG_STRING =  'pvphouse-' + "${getDate()}" + "-" + TAG_PART_COMMIT.toString().trim()
        }

    }

    def isRelease = project.gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    if(!isRelease){
        return TAG_STRING.trim().replace("-g", "-") + "-" + "debug-" + semVer
    }else {
        return TAG_STRING.trim().replace("-g", "-") + "-" + "release-" + semVer
    }
}

// PvPHouse: stores only accept an update when versionCode grows, so derive it from the newest
// vX.Y.Z tag reachable from HEAD: major*1_000_000 + minor*1_000 + patch (v1.2.3 -> 1002003).
// Builds before the first release tag use 1.
def getVersionCode = {
    try {
        String tag = providers.exec {
            commandLine 'git', 'describe', '--tags', '--abbrev=0', '--match', 'v[0-9]*.[0-9]*.[0-9]*'
            ignoreExitValue = true
        }.getStandardOutput().asText.get().trim()
        def m = tag =~ /^v(\d+)\.(\d+)\.(\d+)$/
        if (m.matches()) {
            return (m.group(1) as int) * 1000000 + (m.group(2) as int) * 1000 + (m.group(3) as int)
        }
    } catch (Exception ignored) {
    }
    return 1
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY");
    if(key != null) return key;
    File curseforgeKeyFile = new File("$projectDir/curseforge_key.txt");
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text;
    }
    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !');
    return "DUMMY";
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'net.kdt.pojavlaunch'

    compileSdk = 37


    signingConfigs {
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // PvPHouse: release key comes ONLY from the environment (GitHub Secrets in CI).
        // Never commit a keystore. See README "Signing".
        customRelease {
            def ksPath = System.getenv("PVPHOUSE_KEYSTORE_FILE")
            if (ksPath != null && !ksPath.isBlank()) {
                storeFile file(ksPath)
                storePassword System.getenv("PVPHOUSE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PVPHOUSE_KEY_ALIAS")
                keyPassword System.getenv("PVPHOUSE_KEY_PASSWORD")
            }
        }
        googlePlayBuild {
            storeFile file("upload.jks")
            storePassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
            keyAlias "upload"
            keyPassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "net.pvphouse.launcher"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode getVersionCode()
        versionName getVersionName()
        multiDexEnabled true //important
        resValue 'string', 'curseforge_api_key', getCFApiKey()
        externalNativeBuild {
            ndkBuild {
                // Fix for Windows command line length limit
                arguments "APP_SHORT_COMMANDS=true"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customDebug
            resValue "string", "app_name", "PvPHouse Launcher (Debug)"
            resValue "string", "app_short_name", "PvPHouse (Debug)"
            resValue 'string', 'application_package', 'net.pvphouse.launcher.debug'
            resValue 'string', 'storageProviderAuthorities', 'net.pvphouse.launcher.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'net.pvphouse.launcher.scoped.controlfolder.debug'
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            // Don't set to true or java.awt will be a.a or something similar.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the release key when PVPHOUSE_KEYSTORE_FILE is set, otherwise falls back
            // to the debug key so local/untagged release builds still install.
            def hasReleaseKey = System.getenv("PVPHOUSE_KEYSTORE_FILE") != null && !System.getenv("PVPHOUSE_KEYSTORE_FILE").isBlank()
            if (!hasReleaseKey) logger.warn('BUILD: PVPHOUSE_KEYSTORE_FILE not set, release APK will be signed with the DEBUG key')
            signingConfig hasReleaseKey ? signingConfigs.customRelease : signingConfigs.customDebug
            // defaultConfig already set
            // multiDexEnabled = true
            // debuggable = true
            resValue "string", "app_name", "PvPHouse Launcher"
            resValue "string", "app_short_name", "PvPHouse"
            resValue 'string', 'storageProviderAuthorities', 'net.pvphouse.launcher.scoped.gamefolder'
            resValue 'string', 'application_package', 'net.pvphouse.launcher'
        }
        gplay {
            initWith release
            signingConfig signingConfigs.googlePlayBuild
            matchingFallbacks = [ 'release' ]
        }
    }

    ndkVersion = "27.3.13750724"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // If you're debugging mesa libs, put them here, android will strip them
            // and not properly link to source files, very smart android studio.
            keepDebugSymbols += ['**/libcutils.so']
            pickFirsts += ['**/libbytehook.so']
        }
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

afterEvaluate {
    def componentJars = [
            ":forge_installer:jar",
            ":arc_dns_injector:jar",
            ":MioLibPatcher:jar",
            ":jre_lwjgl3glfw:jar"
    ]

    tasks.withType(com.android.build.gradle.tasks.MergeSourceSetFolders).configureEach { t ->
        t.dependsOn(componentJars)
    }

    // Needed or else the release builds complain about undeclared dependencies
    tasks.matching { it.name.toLowerCase().contains("lint") }.configureEach { t ->
        t.dependsOn(componentJars)
    }
}

