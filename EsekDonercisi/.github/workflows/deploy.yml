name: GitHub Pages'e Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Site klasörünü hazırla
        run: |
          mkdir -p _site
          cp index.html style.css _site/
          cp -r src _site/
          touch _site/.nojekyll
          ls -R _site

      - name: Pages yapılandır
        uses: actions/configure-pages@v5

      - name: Site paketini yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages'e dağıt
        id: deployment
        uses: actions/deploy-pages@v4
