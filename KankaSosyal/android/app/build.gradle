plugins {
    id 'com.android.application'
}

// Uygulamanın web kök klasörü (KankaSosyal/) — APK içine assets/www olarak kopyalanır.
def webRoot = file('../..')
def webOut = layout.buildDirectory.dir('generated/webassets')

android {
    namespace 'com.kanka.sosyal'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kanka.sosyal'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // Sabit imza anahtarı: her sürüm aynı anahtarla imzalanır, böylece uygulama içinden
    // eskisinin üstüne güncellenebilir. Anahtar depoda DEĞİL; GitHub'daki gizli ayarlardan
    // (KANKA_KEYSTORE_B64 / KANKA_KEYSTORE_PASSWORD) derleme sırasında çözülür.
    def ksFile = System.getenv('KANKA_KEYSTORE_FILE')
    def ksPass = System.getenv('KANKA_KEYSTORE_PASSWORD')
    def hasKs = ksFile && ksPass && file(ksFile).exists()

    signingConfigs {
        kanka {
            if (hasKs) {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias 'kanka'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKs ? signingConfigs.kanka : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += webOut.get().asFile
        }
    }
}

tasks.register('copyWebAssets', Copy) {
    into webOut.get().dir('www')
    from(webRoot) {
        include 'index.html', 'style.css', 'js/**', 'manifest.webmanifest', 'icons/**'
    }
    // CI'da indirilen supabase-js (internet olmadan da yüklensin diye APK'ya gömülür)
    from(file('../vendor')) {
        include 'supabase.js'
        into 'vendor'
    }
}
preBuild.dependsOn 'copyWebAssets'

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
