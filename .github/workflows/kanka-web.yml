name: Kanka Web

# KankaSosyal/ klasörü her değiştiğinde web sürümünü GitHub Pages'te yayınlar:
#   https://canbey123x.github.io/pvphouselauncher/
# İlk seferde bir kez: Settings > Pages > Source = "Deploy from a branch", Branch = gh-pages, / (root).

on:
  push:
    paths:
      - 'KankaSosyal/**'
      - '.github/workflows/kanka-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kanka-web
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Site dosyalarını hazırla
        run: |
          mkdir -p site/vendor
          cd KankaSosyal
          cp -r index.html 404.html style.css manifest.webmanifest sw.js server.json js icons legal .well-known ../site/
          cd ..
          curl -fsSL --retry 4 https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js -o site/vendor/supabase.js
          touch site/.nojekyll
          # web sürümü otomatik güncellemesi bu dosyaya bakar
          printf '{"v":"%s","t":"%s"}\n' "${GITHUB_SHA::12}" "$(date -u +%FT%TZ)" > site/version.json
          sed -i "s/__SURUM__/${GITHUB_SHA::12}-$GITHUB_RUN_NUMBER/" site/sw.js
          ls -la site

      - name: gh-pages dalına yayınla
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Kanka web: ${{ github.sha }}"
