name: MC API probe

# Developer tool: dumps the Mojang-mapped signatures of Minecraft classes the PvPHouse mod
# needs, so mod code can be written against the real 1.21.11 API. Runs only on the
# "api-probe" branch; never builds or publishes the launcher.
on:
  push:
    branches: [ 'api-probe' ]

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Resolve Minecraft (named) via Loom
        working-directory: pvphouse-autologin
        run: ./gradlew compileJava --no-daemon -q
      - name: Dump class list and signatures
        run: |
          JAR=$(find ~/.gradle pvphouse-autologin/.gradle -name '*.jar' -path '*minecraft*' 2>/dev/null | grep -iE 'merged|client' | grep -iv 'sources' | xargs ls -S 2>/dev/null | head -n1)
          echo "JAR=$JAR"
          echo "===== CLASSES ====="
          unzip -l "$JAR" | awk '{print $4}' | grep -E '\.class$' | grep -iE 'PlayerSkin|AvatarRenderer|PlayerRenderer|ClientAvatar|AbstractClientPlayer|CapeLayer|WingsLayer|CustomHeadLayer|SubmitNodeCollector|/Identifier\.class|ResourceLocation\.class|DynamicTexture|TextureManager|NativeImage|RenderLayer\.class|RenderLayerParent|AvatarRenderState|PlayerRenderState|HumanoidRenderState|ModelLayers\.class|LayerDefinition|CubeListBuilder|PartDefinition|MeshDefinition|PartPose|ModelPart\.class|PlayerModel|HumanoidModel|EntityRendererProvider|RenderType\.class|RenderTypes|ClientAsset|OrderedSubmitNodeCollector|EntityModelSet|LivingEntityRenderer\.class|EntityRenderers\.class|EntityRenderDispatcher\.class|PoseStack\.class|SkinManager' | grep -v '\$' | sort
          mkdir -p /tmp/cls && cd /tmp/cls && unzip -q -o "$JAR"
          for c in \
            net/minecraft/client/player/AbstractClientPlayer \
            net/minecraft/world/entity/player/PlayerSkin \
            net/minecraft/client/resources/PlayerSkin \
            net/minecraft/client/renderer/entity/player/AvatarRenderer \
            net/minecraft/client/renderer/entity/player/PlayerRenderer \
            net/minecraft/client/renderer/entity/layers/RenderLayer \
            net/minecraft/client/renderer/entity/layers/CapeLayer \
            net/minecraft/client/renderer/entity/layers/WingsLayer \
            net/minecraft/client/renderer/entity/state/AvatarRenderState \
            net/minecraft/client/renderer/entity/state/PlayerRenderState \
            net/minecraft/client/renderer/SubmitNodeCollector \
            net/minecraft/client/renderer/OrderedSubmitNodeCollector \
            net/minecraft/client/renderer/texture/DynamicTexture \
            net/minecraft/client/renderer/texture/TextureManager \
            com/mojang/blaze3d/platform/NativeImage \
            net/minecraft/resources/Identifier \
            net/minecraft/resources/ResourceLocation \
            net/minecraft/client/model/geom/ModelPart \
            net/minecraft/client/model/geom/builders/CubeListBuilder \
            net/minecraft/client/model/geom/builders/PartDefinition \
            net/minecraft/client/model/geom/builders/MeshDefinition \
            net/minecraft/client/model/geom/builders/LayerDefinition \
            net/minecraft/client/model/geom/PartPose \
            net/minecraft/client/model/player/PlayerModel \
            net/minecraft/client/model/PlayerModel \
            net/minecraft/client/model/HumanoidModel \
            net/minecraft/client/renderer/entity/LivingEntityRenderer \
            net/minecraft/client/renderer/RenderType \
            net/minecraft/client/renderer/rendertype/RenderTypes \
            net/minecraft/core/ClientAsset \
            net/minecraft/client/entity/ClientAvatarEntity \
            net/minecraft/client/entity/ClientAvatarState \
            ; do
            if [ -f "$c.class" ]; then echo "===== $c ====="; javap -p "$c.class" | grep -vE '^\s*(private|static final)\s' | head -120; fi
          done
