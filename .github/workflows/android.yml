name: Android CI

# PvPHouse Launcher
# - every push / PR      -> debug APK (artifact)
# - tags "v*"            -> release APK signed with the key from GitHub Secrets + GitHub Release
#
# Required secrets for release builds (Settings -> Secrets and variables -> Actions):
#   PVPHOUSE_KEYSTORE_BASE64   base64 of your .jks file   (base64 -w0 release.jks)
#   PVPHOUSE_KEYSTORE_PASSWORD keystore password
#   PVPHOUSE_KEY_ALIAS         key alias
#   PVPHOUSE_KEY_PASSWORD      key password

on:
  push:
    branches: [ '**', '!api-probe' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release on tags

# A newer push to the same branch cancels the older run, so an outdated build can never
# overwrite the rolling "latest-debug" release after a newer one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0   # version name uses `git describe --tags`

      # 21 is the default (listed last) for the launcher build; 25 is only used to run
      # Gradle for the auto-login mod (Fabric Loom 1.19 needs a Java 25 JVM).
      - name: Set up JDK 21 (+25 for the mod build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            25
            21

      # Java 8 runtime (old MC versions) - same source as upstream Amethyst
      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      # Java 21 runtime bundled in the APK (MC 1.20.5+ / 1.21.11 needs it).
      # Uses the same per-arch archives the launcher would otherwise download at runtime
      # (NewJREUtil.getJreSource). The launcher's internal-runtime installer extracts
      # universal.tar.xz then bin-<arch>.tar.xz into one folder, so a full per-arch archive
      # works as bin-<arch> with an empty universal part. No native code changes.
      - name: Bundle JRE 21
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          D=app_pojavlauncher/src/main/assets/components/jre-21
          DL=$(mktemp -d)
          mkdir -p "$D"
          gh release download download_jre21 -R AngelAuraMC/angelauramc-openjdk-build \
            -D "$DL" -p 'jre21-android-*.tar.xz'
          ls -la "$DL"
          for a in arm64 arm x86_64; do
            if [ -f "$DL/jre21-android-$a.tar.xz" ]; then
              cp "$DL/jre21-android-$a.tar.xz" "$D/bin-$a.tar.xz"
            else
              echo "::warning::No bundled JRE 21 for $a (launcher will download it on demand)"
            fi
          done
          test -f "$D/bin-arm64.tar.xz"   # arm64 is the main target, fail loudly if missing
          tar -cJf "$D/universal.tar.xz" -T /dev/null
          echo "jre21-$(cat "$D"/bin-*.tar.xz | sha256sum | cut -c1-16)" > "$D/version"
          ls -la "$D"; cat "$D/version"

      # PvPHouse auto-login client mod (Fabric, MC 1.21.11), bundled into the APK assets
      - name: Build PvPHouse auto-login mod
        working-directory: pvphouse-autologin
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          java -version
          ./gradlew build --no-daemon --stacktrace
          ls -la build/libs
          JAR=$(ls build/libs/pvphouse-autologin-*.jar | grep -v -- '-sources' | head -n1)
          test -n "$JAR"
          mkdir -p ../app_pojavlauncher/src/main/assets/pvphouse
          cp "$JAR" ../app_pojavlauncher/src/main/assets/pvphouse/pvphouse-autologin.jar
          unzip -l ../app_pojavlauncher/src/main/assets/pvphouse/pvphouse-autologin.jar
          # Guard: in the production jar the mixin must target the intermediary name (method_XXXX),
          # either directly in the annotation or through a refmap. Otherwise auto-login would be
          # silently skipped at runtime, so fail the build instead.
          CHECK=$(mktemp -d)
          unzip -q -o ../app_pojavlauncher/src/main/assets/pvphouse/pvphouse-autologin.jar -d "$CHECK"
          MIXIN_CLASS=$(find "$CHECK" -name 'ClientPacketListenerMixin.class' | head -n1)
          test -n "$MIXIN_CLASS"
          "$JAVA_HOME/bin/javap" -v "$MIXIN_CLASS" | grep -E 'handleLogin|method_|class_' || true
          REFMAP=$(find "$CHECK" -maxdepth 1 -name '*refmap*.json' | head -n1)
          if [ -n "$REFMAP" ]; then cat "$REFMAP"; fi
          if "$JAVA_HOME/bin/javap" -v "$MIXIN_CLASS" | grep -q 'method_' \
             || { [ -n "$REFMAP" ] && grep -q 'method_' "$REFMAP"; }; then
            echo "Mixin target is remapped to intermediary: OK"
          else
            echo "::error::Auto-login mixin target was not remapped to intermediary names"; exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/pvphouse-launcher-debug.apk
          md5sum out/pvphouse-launcher-debug.apk > out/pvphouse-launcher-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pvphouse-launcher-debug
          path: out/pvphouse-launcher-debug.*

      # Rolling test build: every successful push to main replaces the "latest-debug" pre-release,
      # so this link always points to the newest APK:
      # https://github.com/<owner>/<repo>/releases/download/latest-debug/pvphouse-launcher-debug.apk
      - name: Publish rolling test build (latest-debug)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug -R "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest-debug out/pvphouse-launcher-debug.apk \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "PvPHouse Launcher - test sürümü (${GITHUB_SHA::7})" \
            --notes "Otomatik test sürümü / automatic test build. Commit: ${GITHUB_SHA::7}. Debug imzalı; resmi sürüm değildir."

      # ---------- release (tags only) ----------
      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KS_B64: ${{ secrets.PVPHOUSE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::PVPHOUSE_KEYSTORE_BASE64 secret is not set - cannot sign release"; exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PVPHOUSE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed Release .apk
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PVPHOUSE_KEYSTORE_PASSWORD: ${{ secrets.PVPHOUSE_KEYSTORE_PASSWORD }}
          PVPHOUSE_KEY_ALIAS: ${{ secrets.PVPHOUSE_KEY_ALIAS }}
          PVPHOUSE_KEY_PASSWORD: ${{ secrets.PVPHOUSE_KEY_PASSWORD }}
        run: |
          gradle :app_pojavlauncher:assembleRelease
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk "out/pvphouse-launcher-${GITHUB_REF_NAME}.apk"
          md5sum "out/pvphouse-launcher-${GITHUB_REF_NAME}.apk" > "out/pvphouse-launcher-${GITHUB_REF_NAME}.md5"
          rm -f "$PVPHOUSE_KEYSTORE_FILE"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/pvphouse-launcher-${GITHUB_REF_NAME}.* \
            -R "$GITHUB_REPOSITORY" --title "PvPHouse Launcher $GITHUB_REF_NAME" --generate-notes
