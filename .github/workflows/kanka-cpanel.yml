name: Kanka cPanel

# KankaSosyal/ her değiştiğinde web sitesini FTP ile cPanel'e yükler.
# Çalışması için GitHub'da: Settings > Secrets and variables > Actions > New repository secret
#   FTP_SERVER    ör. ftp.alanadin.com
#   FTP_USERNAME  cPanel > FTP Accounts'ta açtığın hesap (ör. kanka@alanadin.com)
#   FTP_PASSWORD  o hesabın şifresi
#   FTP_DIR       (isteğe bağlı) sitenin klasörü, ör. /public_html/  — boşsa FTP hesabının kök klasörü
# Bu ayarlar yoksa iş atlanır, hata vermez.

on:
  push:
    paths:
      - 'KankaSosyal/**'
      - '.github/workflows/kanka-cpanel.yml'
  workflow_dispatch:

concurrency:
  group: kanka-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
    steps:
      - name: FTP ayarı var mı?
        run: |
          if [ "$HAS_FTP" != "true" ]; then
            echo "::notice::FTP_SERVER / FTP_USERNAME / FTP_PASSWORD ayarlanmamış, cPanel yüklemesi atlandı."
          fi

      - name: FTP adresini temizle ve kontrol et
        if: env.HAS_FTP == 'true'
        env:
          RAW: ${{ secrets.FTP_SERVER }}
        run: |
          # "ftp://", "https://", sondaki "/" ve ":21" gibi fazlalıkları ve boşlukları at
          HOST=$(printf '%s' "$RAW" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##')
          echo "FTP_HOST=$HOST" >> "$GITHUB_ENV"
          if [ "$HOST" != "$RAW" ]; then echo "::notice::FTP_SERVER içindeki fazlalıklar temizlendi (ftp://, /, port ya da boşluk)."; fi
          if printf '%s' "$HOST" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$|:'; then
            echo "FTP sunucusu IP adresi olarak verilmiş, ad kontrolü atlandı."
          elif getent ahosts "$HOST" > /dev/null; then
            echo "FTP sunucusu bulundu."
          else
            echo "::error::FTP_SERVER adresi internette bulunamadı. Sadece sunucu adını yaz (ör. ftp.alanadin.com ya da cPanel'deki sunucu adı / IP). Alan adın yeni alındıysa yönlenmesi birkaç saat sürebilir; bu sürede cPanel'in sunucu adını ya da IP adresini kullan."
            exit 1
          fi

      - name: Kodu çek
        if: env.HAS_FTP == 'true'
        uses: actions/checkout@v4

      - name: Site dosyalarını hazırla
        if: env.HAS_FTP == 'true'
        run: |
          mkdir -p site/vendor
          cd KankaSosyal
          cp -r index.html 404.html style.css manifest.webmanifest sw.js server.json js icons legal .well-known ../site/
          cp cpanel.htaccess ../site/.htaccess
          cd ..
          curl -fsSL --retry 4 https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js -o site/vendor/supabase.js
          # web sürümü otomatik güncellemesi bu dosyaya bakar
          printf '{"v":"%s","t":"%s"}\n' "${GITHUB_SHA::12}" "$(date -u +%FT%TZ)" > site/version.json
          sed -i "s/__SURUM__/${GITHUB_SHA::12}-$GITHUB_RUN_NUMBER/" site/sw.js
          ls -la site

      - name: cPanel'e yükle (FTP)
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: ${{ secrets.FTP_DIR || './' }}
          dangerous-clean-slate: false
